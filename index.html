<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김민준</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1a1a1a; 
            color: #fff;
            padding: 60px 20px;
        }

        .gallery-stream {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px; 
            max-width: 700px; 
            margin: 0 auto;
        }
        .gallery-item {
            width: 100%;
            aspect-ratio: 1 / 1.4142; 
            background-color: #222;
            border-radius: 0; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

     
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 0; 
            display: block;
        }

    
        .gallery-item .desc {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
            font-size: 1.1rem;
            color: #fff;
            text-align: center;
        }
       
        .gallery-item .desc:empty {
            display: none;
        }
    </style>
</head>
<body>

    <div class="gallery-stream">
        <!-- 1번부터 12번까지 배치 -->
        <div class="gallery-item"><img src="kimminjun_page-11.jpg" alt=""><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-12.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-13.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-14.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-15.jpg"><div class="desc"></div></div>
        
        <div class="gallery-item"><img src="kimminjun_page-16.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-17.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-18.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-19.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-20.jpg"><div class="desc"></div></div>
        
        <div class="gallery-item"><img src="kimminjun_page-21.jpg"><div class="desc"></div></div>
        <div class="gallery-item"><img src="kimminjun_page-22.jpg"><div class="desc"></div></div>
    </div>

</body>
</html>
